# truncation_length = 1

# [git_branch]
# format = "\b[](bg:purple fg:red)[ $symbol$branch ](bg:purple fg:#292d3e)[](fg:purple)"
# symbol = " "

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$line_break\
$character"""

add_newline = false

[directory]
style = "blue"
truncation_length = 1

[character]
error_symbol = "[❯](red)"
success_symbol = "[❯](purple)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
conflicted = "​"
deleted = "​"
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
modified = "​"
renamed = "​"
staged = "​"
stashed = "≡"
style = "cyan"
untracked = "​"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[python]
detect_extensions = []
detect_files = []
disabled = true 
format = ""
